server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses (the JS and CSS bundles are several hundred kB uncompressed, API answers are JSON).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;

    # Sent with every response. `always` also covers error pages.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # Vite writes a content hash into every file name under /assets/, so they never change in place.
    # nginx drops inherited add_header lines once a block has its own, hence the repetition.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The page shell must be revalidated, or browsers keep pointing at bundles of an old release.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Station photos are sent as base64 JSON: 15 MB photo -> ~20 MB body.
        # Keep in sync with MAX_PHOTO_BODY_BYTES in shared/uploadLimits.ts (nginx default is 1m).
        client_max_body_size 21m;
        # The area audit and terrain profile wait for external elevation services.
        proxy_read_timeout 90s;
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
